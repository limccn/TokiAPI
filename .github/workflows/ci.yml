# CI —— 零 secrets 的验证流水线（10-08-open-source-release-prep 立红线；10-14 一键发布适配后无渲染步）
#
# 设计红线：
#   - `permissions: contents: read`（最小权限）；**零 `secrets.*` 引用**；无 curl 外传；
#     第三方 action 仅 actions/checkout 与 actions/setup-node。
#   - CI 无 `.dev.vars`：测试环境由 vitest.config.ts 全量 pin + TEST_MIGRATIONS 提供
#     （wrangler.jsonc 常驻仓库提供绑定；tests/config-fork.test.ts 钉配置结构契约）。
#   - 全量并行 miniflare isolate 会 OOM ⇒ 测试限 `--maxWorkers=2`。

name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # wrangler.jsonc 常驻 ⇒ vite 插件按其 assets.directory 产 dist/client（render-before-build
      # 的踩坑链根因随渲染管线拆除而消失，见 wrangler.jsonc 头注）。
      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --maxWorkers=2

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck
